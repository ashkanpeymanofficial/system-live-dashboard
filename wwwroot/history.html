<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>History - System Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; padding: 24px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { font-size: 1.5em; font-weight: 700; background: linear-gradient(90deg, #38bdf8, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-group { display: flex; gap: 10px; }
        button, a.btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0; padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-family: inherit; font-size: 0.9em; text-decoration: none;
            transition: all 0.2s;
        }
        button:hover, a.btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
        button.active { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8; }
        .panel { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 16px; padding: 20px; }
        .panel-title { font-size: 0.85em; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
        canvas { max-height: 500px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 System History</h1>
        <div class="btn-group">
            <button onclick="loadData(1)" id="btn1h" class="active">Last 1 Hour</button>
            <button onclick="loadData(24)" id="btn24h">Last 24 Hours</button>
            <a href="/api/history/export" class="btn" download="system_metrics.csv">⬇ Download CSV</a>
            <a href="/" class="btn">← Back to Live</a>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Resource Usage Over Time</div>
        <canvas id="historyChart"></canvas>
    </div>

    <script>
        let chart;

        async function loadData(hours) {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            document.getElementById(hours === 1 ? 'btn1h' : 'btn24h').classList.add('active');

            const res = await fetch(`/api/history?hours=${hours}`);
            const data = await res.json();

            const labels = data.map(d => d.time);
            const cpu = data.map(d => d.cpu);
            const mem = data.map(d => d.mem);

            if (chart) chart.destroy();

            const ctx = document.getElementById('historyChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'CPU %', data: cpu, borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
                        { label: 'RAM %', data: mem, borderColor: '#a78bfa', backgroundColor: 'rgba(167, 139, 250, 0.1)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#64748b' } },
                        x: { grid: { display: false }, ticks: { color: '#64748b', maxTicksLimit: 20 } }
                    },
                    plugins: { legend: { labels: { color: '#cbd5e1' } } }
                }
            });
        }

        loadData(1);
    </script>
</body>
</html>
